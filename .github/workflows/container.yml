name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install and test
        run: |
          python -m pip install '.[test]'
          python -m unittest discover -s tests -v
          python -m house_climate --config config.example.toml check-config
          python -m house_climate --config config.example.toml demo
      - name: Check add-on version
        run: |
          python - <<'PY'
          import json, tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())
          addon = json.loads(Path("house_climate_addon/config.json").read_text())
          manifest = json.loads(Path("custom_components/house_climate/manifest.json").read_text())
          assert project["project"]["version"] == addon["version"] == manifest["version"]
          assert addon["options"]["live"] is False
          PY

  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Test native integration against Home Assistant
        run: |
          python -m pip install '.[test]' 'homeassistant==2026.10.4'
          python -m unittest discover -s tests_homeassistant -v
      - name: Test release publishing without GitHub writes
        run: node --test tests_release/*.test.cjs
      - name: Package HACS and reviewable public distribution
        run: python scripts/package_hacs.py
      - name: Validate installation and public-source archives
        run: python scripts/validate_distribution.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-climate-hacs-install
          path: dist/*.zip
          if-no-files-found: error

  image:
    needs: [test, homeassistant]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Read image metadata and create installation bundles
        id: config
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          addon = json.loads(Path("house_climate_addon/config.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("version=" + addon["version"], file=output)
              print("image=" + addon["image"], file=output)
          PY
          python scripts/package_addon.py
          mkdir -p /tmp/addon-build
          tar -xzf dist/home-climate-local.tar.gz -C /tmp/addon-build
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build local-install bundle for smoke testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: /tmp/addon-build/house_climate
          load: true
          platforms: linux/amd64
          tags: home-climate:test
          build-args: BUILD_VERSION=${{ steps.config.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test packaged CLI without HA access
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --user 10001:10001 \
            --entrypoint python home-climate:test -m house_climate \
            --config /opt/home-climate/config.example.toml check-config
          docker run --rm --network none --read-only --tmpfs /tmp --user 10001:10001 \
            --entrypoint python home-climate:test -m house_climate \
            --config /opt/home-climate/config.example.toml demo
          docker run --rm --network none --read-only --entrypoint python home-climate:test \
            -c 'import ssl; from zoneinfo import ZoneInfo; assert ssl.create_default_context().get_ca_certs(); ZoneInfo("America/Los_Angeles")'
      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.config.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.config.outputs.version }},enable={{is_default_branch}}
            type=sha,format=long
      - name: Build and publish AMD64 and ARM64
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_VERSION=${{ steps.config.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published architectures and ARM64 CLI
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          IMAGE: ${{ steps.config.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > /tmp/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("/tmp/manifest.json").read_text())
          platforms = {(m["platform"]["os"], m["platform"]["architecture"]) for m in manifest["manifests"]}
          assert {("linux", "amd64"), ("linux", "arm64")} <= platforms, platforms
          PY
          docker run --rm --platform linux/arm64 --network none --read-only \
            --entrypoint python "$IMAGE@$DIGEST" -m house_climate \
            --config /opt/home-climate/config.example.toml demo
          echo "Published $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HA installation bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-climate-ha-install
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [test, homeassistant, image]
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: home-climate-*-install
          merge-multiple: true
          path: dist
      - name: Publish versioned GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const publish = require('./scripts/publish_release.cjs');
            await publish({ github, context, core });
