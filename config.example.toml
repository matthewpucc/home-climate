# Optional standalone/import example. Native HA users can configure everything
# through Settings > Devices & services > House Climate > Configure.
# All stored temperatures and deltas use Fahrenheit; HA forms use your local units.
schema_version = 2
timezone = "Etc/UTC"
helper_prefix = "house_climate"
low_f = 66
high_f = 75
poll_seconds = 15 # Safety, heartbeat, and recovery checks; keep at most 30s live.
decision_interval_seconds = 90 # Ordinary comfort adjustments; 60–120s recommended.
head_minimum_run_seconds = 300 # Minimum requested head mode duration; safety can stop early.
head_minimum_off_seconds = 180 # Per-head rest before activation; shared settling still applies.
head_activation_timeout_seconds = 120 # Wait for exact mode/setpoint feedback; Off timing stays 45s.
# Active calls use a device setpoint beyond both the room target and onboard
# temperature, within device limits; independent room probes decide when to stop.
# These are Fahrenheit differences. Set either to 0 for direct room setpoints.
head_heat_call_offset_f = 5
head_cool_call_offset_f = 5
off_settle_seconds = 180 # Confirm the required interval for your shared equipment.
mode_hold_seconds = 1200
switch_confirmation_seconds = 120
sensor_stale_seconds = 900
sensor_confirmation_seconds = 60
sensor_disagreement_f = 3
forecast_minutes = 10
equipment_timing_confirmed = false

# Optional independent heater. Remove these fields if you do not have one.
heater_entity = "climate.example_auxiliary"
auxiliary_room = "room_c"
auxiliary_fan_enabled = true
heater_high_setpoint_f = 86
heater_cutoff_f = 70
heater_setpoint_confirmed = false

[heads]
shared_a = "climate.example_head_a"
shared_b = "climate.example_head_b"

# Optional physical cooling minima when HA advertises incomplete equipment limits.
# Confirm these in the device app/manual; omit the table when no override is needed.
# Keys are quoted physical climate entity IDs, not the logical head keys above.
[head_cool_min_f]
"climate.example_head_a" = 65

# IDs remain stable when display names change. Multiple rooms may share one head.
[rooms.room_a]
name = "Room A"
head = "shared_a"
sensors = [
  {entity_id = "sensor.example_a_1", source = "probe_a_1"},
  {entity_id = "sensor.example_a_2", source = "probe_a_2"},
]
[rooms.room_a.profile]
target_f = 72
half_band_f = 0.5
priority = 1

# Airflow rules belong to the room they help, regardless of a fan's location.
[[rooms.room_a.fans]]
entity_id = "fan.example_transfer"
strategy = "transfer"
source_room = "room_b"
percentage = 60

[rooms.room_b]
name = "Room B"
head = "shared_a"
sensors = [
  # This example probe reports only when its temperature changes. Its last value
  # stays usable while available; other probes retain the normal age check.
  {entity_id = "sensor.example_b_1", source = "probe_b_1", report_on_change = true},
  {entity_id = "sensor.example_b_2", source = "probe_b_2"},
]
[rooms.room_b.profile]
comfort_enabled = false
target_f = 70
half_band_f = 0.5
fan_percentage = 0

# Daily schedule, using HA's timezone during connected operation.
[[rooms.room_b.schedules]]
name = "Sleep"
start = "22:00:00"
end = "05:00:00"
target_f = 68
half_band_f = 1
priority = 10
fan_percentage = 60

[[rooms.room_b.schedules]]
name = "Morning"
start = "05:00:00"
end = "09:00:00"
target_f = 69.5
low_f = 66
high_f = 70
half_band_f = 0.5
priority = 1
fan_percentage = 0

[[rooms.room_b.fans]]
entity_id = "fan.example_scheduled"
strategy = "schedule"

[rooms.room_c]
name = "Room C"
head = "shared_b"
sensors = [
  {entity_id = "sensor.example_c_1", source = "probe_c_1"},
  {entity_id = "sensor.example_c_2", source = "probe_c_2"},
]
[rooms.room_c.profile]
target_f = 68
half_band_f = 0.5
priority = 0.1
