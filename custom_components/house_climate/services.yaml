generate_package:
  name: Generate control and watchdog configuration
  description: >-
    Write the current enable, lease, and optional auxiliary-watchdog package and
    dashboard card to house_climate_generated in the Home Assistant configuration
    directory. Replaces generated files; installation into HA packages is manual.

commission_heater_relay:
  name: Commission dedicated heater relay recovery
  description: >-
    Deliberately cut the dedicated heater outlet while the native heater is
    already Off, then exercise its normal guarded cooldown and restoration.
    Requires local supervision, live permission, Controller enabled Off, fresh
    native Off and low dedicated load, healthy electrical readings, and shared
    AC fallback disabled. Does not start heating or switch shared AC output.
    Returns after the initial cutoff; follow progress on the Heater power guard.
  fields:
    confirm:
      name: Confirm supervised dedicated-outlet power cycle
      description: >-
        Set true only when beside the heater, ready to stop it manually, and
        deliberately authorizing this dedicated-outlet cutoff and recovery test.
      required: true
      selector:
        boolean:

approve_heater_restore:
  name: Approve dedicated heater recovery
  description: Approve one dedicated relay restoration after a cutoff. Requires live commands, physical relay Off, verified supply, completed cooldown and no auxiliary jobs. Does not restore shared AC. Approval expires after two minutes or a new fault.
  fields:
    confirm:
      name: Confirm heater power restoration
      required: true
      selector:
        boolean:

thermal_history_query:
  name: Query thermal evidence history
  description: Read bounded raw source reports, summaries and planned-demand episodes from Home Climate's private SQLite history. Timestamps are UTC Unix seconds. Does not operate equipment.
  fields:
    start:
      name: Start timestamp
      required: true
      selector:
        number:
          min: 0
          max: 9999999999
          mode: box
    end:
      name: End timestamp
      required: true
      selector:
        number:
          min: 0
          max: 9999999999
          mode: box
    limit:
      name: Maximum rows per record type
      default: 200
      selector:
        number:
          min: 1
          max: 1000
          mode: box
start_head_fan_trial:
  name: Start bounded heat pump fan trial
  description: Explicitly enroll one natural conditioning call. Does not force HVAC demand. Cached reports do not prove physical fan speed. Default disabled; all served rooms must be listed.
  fields:
    confirm:
      required: true
      selector:
        boolean:
    entity_id:
      required: true
      selector:
        entity:
          domain: climate
    room_ids:
      required: true
      example: [synthetic_room]
      selector:
        object:
    mode:
      required: true
      selector:
        text:
    duration_minutes:
      required: true
      selector:
        number:
          min: 10
          max: 720
          unit_of_measurement: min
    sleep_sensitive:
      default: true
      selector:
        boolean:
    overnight_authorized:
      default: false
      selector:
        boolean:
cancel_head_fan_trial:
  name: Cancel heat pump fan trial
  description: End enrollment or request baseline restoration under the existing ownership lease. Does not bypass safety or replay uncertain writes.
acknowledge_head_fan_restoration:
  name: Acknowledge heat pump fan restoration review
  description: After human inspection/restoration, retire an interrupted trial only when the baseline is reported and no device service remains pending. Does not operate equipment or prove physical fan speed.
  fields:
    confirm:
      required: true
      selector:
        boolean:
