[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-climate-controller"
version = "0.8.13"
description = "Fixed Home Climate policy and heater protection for Home Assistant"
requires-python = ">=3.11"
dependencies = []
license = {file = "LICENSE"}
readme = "README.md"

[project.optional-dependencies]
test = ["Jinja2>=3.1.6,<4"]

[project.scripts]
home-climate = "house_climate.__main__:main"
# Keep the original command usable for existing scripts.
house-climate = "house_climate.__main__:main"

[tool.setuptools]
packages = ["house_climate"]
package-dir = {house_climate = "custom_components/house_climate/controller"}
