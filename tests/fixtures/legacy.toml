# Synthetic version-1 configuration for migration and regression tests.
timezone = "America/Los_Angeles" # Override if different from your HA timezone.
poll_seconds = 15
sensor_stale_seconds = 900
sensor_confirmation_seconds = 60
sensor_disagreement_f = 3.0
forecast_minutes = 10
mode_hold_seconds = 1200
switch_confirmation_seconds = 120
off_settle_seconds = 180 # Provisional: verify against the equipment.
command_timeout_seconds = 45
equipment_timing_confirmed = false # Required for --live.
heater_high_setpoint_f = 86.0 # Verify supported range and that this calls for heat.
heater_setpoint_confirmed = false # Required for --live.
heater_cutoff_f = 70.0
heater_entity = "climate.fixture_1" # Auxiliary heater: heat, fan_only, or off.

[heads]
bonus = "climate.fixture_2"
guest = "climate.fixture_3"
primary = "climate.fixture_4"
living = "climate.fixture_5"

[fans]
entertainment = "fan.fixture_6"
office = "fan.fixture_7"
guest = "fan.fixture_8"
primary = "fan.fixture_9"

# Empty probe lists inhibit that head's operation.
# Optional: attribute = "current_temperature", unit = "°F", offset_f = 0.0.
# Two aliases from one physical probe must share the same source identifier.
[zones.office]
head = "bonus"
sensors = [
  {entity_id = "sensor.fixture_10", source = "probe_24"},
  {entity_id = "sensor.fixture_11", source = "probe_25"},
  {entity_id = "sensor.fixture_12", source = "probe_26"},
]
[zones.entertainment]
head = "bonus"
sensors = [
  {entity_id = "sensor.fixture_13", source = "probe_27"},
]
[zones.guest]
head = "guest"
sensors = [
  {entity_id = "sensor.fixture_14", source = "probe_28"},
  {entity_id = "sensor.fixture_15", source = "probe_29"},
  {entity_id = "sensor.fixture_16", source = "probe_30"},
]
[zones.primary]
head = "primary"
sensors = [
  {entity_id = "sensor.fixture_17", source = "probe_31"},
  {entity_id = "sensor.fixture_18", source = "probe_32"},
  {entity_id = "sensor.fixture_19", source = "probe_33"},
]
[zones.living]
head = "living"
sensors = [
  {entity_id = "sensor.fixture_20", source = "probe_34"},
  {entity_id = "sensor.fixture_21", source = "probe_35"},
  {entity_id = "sensor.fixture_22", source = "probe_36"},
]
